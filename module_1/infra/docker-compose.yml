# Les trois bases du module 1. Chaque service = une base.
# healthcheck : dit quand la base est vraiment prête.
# Ports sur 127.0.0.1 : personne d'autre sur le réseau ne peut s'y connecter.
name: senmarket-bases

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-senmarket}
    ports: ['127.0.0.1:5432:5432']
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-senmarket}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Définis MONGO_PASSWORD dans .env}
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    # Cache pur : pas de sauvegarde disque, mémoire limitée,
    # on n'évince que les clés qui ont un TTL.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Définis REDIS_PASSWORD dans .env}', '--save', '', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'volatile-lru']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg_data:
  mongo_data:
